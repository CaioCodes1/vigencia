name: crbap

# Uso no dia a dia (recomendado):
#   docker compose up -d                  -> so a infra; a app roda pela IDE / mvn spring-boot:run
#   docker compose --profile app up -d    -> tudo em container, para validar o empacotamento
#   docker compose --profile observability up -d   -> Prometheus, Grafana e Loki (fase 8)

services:
  postgres:
    image: postgres:16-alpine
    container_name: crbap-postgres
    environment:
      POSTGRES_DB: crbap
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Sem isso o Postgres inicializa o cluster em C, e ordenacao/ILIKE
      # de texto com acento saem diferentes do que a aplicacao espera.
      LANG: pt_BR.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d crbap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crbap-redis
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 320m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crbap-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "${RABBIT_PORT:-5673}:5672"
      - "${RABBIT_MGMT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crbap-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/crbap
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # ================================================================
  # Observabilidade (fase 8) — docker compose --profile observability up -d
  #
  # Fica atras de um perfil de proposito: sao mais 4 containers e ~700 MB.
  # No dia a dia nao precisa, e numa maquina apertada a diferenca entre
  # subir e nao subir a stack e o build passar ou morrer de memoria.
  #
  # Prometheus  http://localhost:9090
  # Grafana     http://localhost:3001   (admin / a senha do .env)
  # Loki        http://localhost:3100
  # ================================================================

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    container_name: crbap-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 dias: metrica local nao serve para analise historica, serve para
      # enxergar a semana. Retencao infinita so enche disco.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    # A app roda no host (IDE / mvn spring-boot:run) no fluxo do dia a dia.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    container_name: crbap-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.3.2
    container_name: crbap-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Descoberta pelo daemon: pega qualquer container da stack sem listar
      # nome por nome. Somente leitura -- o Promtail nao precisa de mais.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtaildata:/tmp
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    container_name: crbap-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Sem cadastro aberto e sem visita anonima, mesmo local: o painel mostra
      # receita e inadimplencia da empresa.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # 3001 e nao 3000: a 3000 e a porta padrao de todo front em Node, e
      # colidir com ela e questao de tempo.
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  promdata:
  lokidata:
  promtaildata:
  grafanadata:
