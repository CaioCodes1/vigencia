name: crbap

# Uso no dia a dia (recomendado):
#   docker compose up -d                  -> so a infra; a app roda pela IDE / mvn spring-boot:run
#   docker compose --profile app up -d    -> tudo em container, para validar o empacotamento
#   docker compose --profile observability up -d   -> Prometheus, Grafana e Loki (fase 8)

services:
  postgres:
    image: postgres:16-alpine
    container_name: crbap-postgres
    environment:
      POSTGRES_DB: crbap
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Sem isso o Postgres inicializa o cluster em C, e ordenacao/ILIKE
      # de texto com acento saem diferentes do que a aplicacao espera.
      LANG: pt_BR.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d crbap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crbap-redis
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 320m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crbap-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "${RABBIT_PORT:-5673}:5672"
      - "${RABBIT_MGMT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crbap-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/crbap
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitdata:
