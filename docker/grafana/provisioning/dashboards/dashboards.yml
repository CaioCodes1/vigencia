apiVersion: 1

providers:
  - name: crbap
    orgId: 1
    folder: CRBAP
    type: file
    disableDeletion: false
    # O arquivo e a verdade: editar pela interface e valido para experimentar,
    # mas a alteracao volta ao que esta no repositorio na proxima carga.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
