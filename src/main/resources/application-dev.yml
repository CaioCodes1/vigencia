# Perfil de desenvolvimento local. Nada aqui deve valer em producao.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings,configprops,env
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.caiocodes.vigencia: DEBUG
    org.hibernate.SQL: DEBUG
    # Mostra o valor dos parametros do PreparedStatement. Util em dev,
    # PROIBIDO em producao: vaza dado de cliente para o log.
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
