spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # never, e nao when-authorized: em producao o /health e publico (o
      # balanceador consulta), e "pendingEvents: 4213" conta ao mundo o
      # tamanho da fila e o estado interno do sistema.
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.caiocodes.vigencia: INFO
    org.hibernate.SQL: WARN
