spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

management:
  endpoints:
    web:
      exposure:
        # /prometheus entra na fase 8, e fica exposto so na rede interna.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.caiocodes.crbap: INFO
    org.hibernate.SQL: WARN
