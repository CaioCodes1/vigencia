<div style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #222;
            max-width: 600px; margin: 0 auto;">
  <h2 style="font-size: 18px; color: #1a6b2a;" th:text="${subject}">Pagamento recebido</h2>

  <p>Olá,</p>

  <p>
    Recebemos o pagamento de <strong th:text="${amountFormatted}">R$ 2.000,00</strong>
    referente a <strong th:text="${reference}">CT-2026-0042 3/12</strong>.
  </p>

  <table cellpadding="6" cellspacing="0"
         style="border-collapse: collapse; margin: 16px 0; font-size: 14px;">
    <tr>
      <td style="color: #666;">Meio</td>
      <td th:text="${method}">PIX</td>
    </tr>
    <tr>
      <td style="color: #666;">Saldo restante</td>
      <td th:text="${remainingFormatted}">R$ 0,00</td>
    </tr>
  </table>

  <p th:if="${settled}" style="color: #1a6b2a;">Esta cobrança está quitada.</p>

  <hr style="border: none; border-top: 1px solid #ddd; margin: 24px 0;">
  <p style="font-size: 12px; color: #777;">Mensagem automática — não responda.</p>
</div>
