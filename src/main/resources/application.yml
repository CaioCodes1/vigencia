spring:
  application:
    name: crbap

  datasource:
    # Nenhum valor sensivel fica aqui. Os defaults servem so para o ambiente
    # local; em qualquer outro lugar vem tudo do ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/crbap}
    username: ${DB_USER:crbap}
    password: ${DB_PASSWORD:crbap}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      # Loga a stack de quem segurou uma conexao por mais de 60s. E o jeito
      # de achar transacao longa antes de o pool esgotar em producao.
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      # O Hibernate CONFERE o schema, nunca o altera. Quem cria tabela e o Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5673}
    username: ${RABBIT_USER:crbap}
    password: ${RABBIT_PASSWORD:crbap}
    # O broker responde "recebi". Sem isto, send() volta na hora e a aplicacao
    # acha que publicou mesmo quando a mensagem se perdeu no caminho.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 10
        # Rejeitado NAO volta para o fim da fila. Com true, uma mensagem
        # permanentemente ruim volta, falha, volta -- e consome 100% de uma CPU
        # num laco infinito. E o poison message loop, um dos jeitos mais
        # rapidos de derrubar um sistema com mensageria.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 60s
          multiplier: 5
          max-interval: 30m

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  # Termina o que esta em andamento antes de morrer. Junto com o 'exec java'
  # do Dockerfile, e o que faz o deploy nao cortar requisicao pela metade.
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method

crbap:
  security:
    issuer: crbap
    audience: crbap-api
    # PEM vindo do ambiente. Ausente fora de produção, um par efêmero é gerado
    # na subida (e todo token cai a cada restart); no perfil prod, a aplicação
    # se recusa a subir sem as chaves.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    # Curto de propósito: token roubado tem validade de 15 minutos. Sessão
    # longa é responsabilidade do refresh, que é rotacionado e revogável.
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-failed-attempts: 5
    lock-duration: 15m
    login-attempts-per-minute: 5
    admin-email: ${ADMIN_EMAIL:admin@crbap.local}
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}

  crypto:
    # 32 bytes em base64 (openssl rand -base64 32). Duas chaves separadas de
    # propósito: cifra e índice cego têm propósitos diferentes, e reaproveitar
    # a mesma comprometeria as duas funções de uma vez.
    # ATENÇÃO: perder data-key = perder os documentos cifrados. O backup da
    # chave é tão crítico quanto o backup do banco.
    data-key: ${DATA_ENCRYPTION_KEY:}
    index-key: ${BLIND_INDEX_KEY:}

  jobs:
    # Desligado nos testes de integração: um job disparando no meio de um teste
    # muda o dado que o teste está conferindo. Ver SchedulingConfig.
    enabled: ${JOBS_ENABLED:true}
    outbox-relay-delay: 5000
    # 03:00 — depois da virada do dia (senão um contrato que vence hoje seria
    # expirado hoje mesmo) e antes do horário comercial.
    expiry-cron: "0 0 3 * * *"
    # Meia hora depois da varredura de contratos, de propósito: um contrato que
    # expira hoje tem cobranças que vencem hoje, e marcar a cobrança antes de o
    # contrato expirar deixa as duas telas discordando durante meia manhã.
    overdue-cron: "0 30 3 * * *"
    notification-dispatch-delay: 60000

  notification:
    # Em dev o remetente escreve o e-mail no log. Ligar isto sem querer com um
    # dump de produção dispara aviso de verdade para cliente de verdade — por
    # isso o padrão é desligado, e não ligado.
    smtp-enabled: ${SMTP_ENABLED:false}
    from: ${NOTIFICATION_FROM:nao-responda@crbap.local}

logging:
  level:
    root: INFO
    com.caiocodes.crbap: INFO
